<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamentos foot4</title>
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #52b788;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 4px;
        }

        .content {
            padding: 20px 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid #ced4da;
            outline: none;
            background-color: #fff;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.25);
        }

        .result-card {
            background: #f1f8f5;
            border-left: 4px solid var(--accent);
            padding: 16px;
            border-radius: 10px;
            margin-top: 16px;
            min-height: 100px;
        }

        .result-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-obs {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .empty-msg {
            color: #6c757d;
            font-size: 0.9rem;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: var(--primary-light);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pagamentos foot4</h1>
        <p>Consulta</p>
    </div>

    <div class="content">
        <div class="form-group">
            <label for="filtro-ano">Ano</label>
            <select id="filtro-ano" onchange="consultar()">
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
        </div>

        <div class="form-group">
            <label for="busca-tipo">Modo de Consulta</label>
            <select id="busca-tipo" onchange="alterarModoBusca()">
                <option value="jogador" selected>Por Jogador (Ver Meses Pagos)</option>
                <option value="mes">Por Mês (Ver Quem Pagou)</option>
            </select>
        </div>

        <div class="form-group" id="group-filtro-jogador">
            <label for="filtro-jogador">Escolher Jogador</label>
            <select id="filtro-jogador" onchange="consultar()">
                <option value="">⏳ A carregar jogadores...</option>
            </select>
        </div>

        <div class="form-group hidden" id="group-filtro-mes">
            <label for="filtro-mes">Escolher Mês</label>
            <select id="filtro-mes" onchange="consultar()">
                <option value="">-- Selecione o Mês --</option>
                <option value="Janeiro">Janeiro</option>
                <option value="Fevereiro">Fevereiro</option>
                <option value="Março">Março</option>
                <option value="Abril">Abril</option>
                <option value="Maio">Maio</option>
                <option value="Junho">Junho</option>
                <option value="Julho">Julho</option>
                <option value="Agosto">Agosto</option>
                <option value="Setembro">Setembro</option>
                <option value="Outubro">Outubro</option>
                <option value="Novembro">Novembro</option>
                <option value="Dezembro">Dezembro</option>
            </select>
        </div>

        <div class="result-card">
            <div class="result-title" id="resultado-titulo">Selecione uma opção acima</div>
            <div id="resultado-conteudo" class="badge-list">
                <span class="empty-msg">A aguardar seleção...</span>
            </div>
        </div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbXXiNjOKMfrvtQvSIoRgoHRy8AKK3C0V2qHUCGrNXpHbenGQ-youHlmQ3Q8HtB6u2M/exec";

    let dadosCache = null;
    let jogadoresGlobais = [];

    // Renderiza a lista de jogadores no dropdown
    function renderizarDropdownJogadores(erro = false) {
        const select = document.getElementById('filtro-jogador');
        if (!select) return;

        if (erro) {
            select.innerHTML = '<option value="">❌ Erro ao carregar jogadores</option>';
            return;
        }

        const valorAtual = select.value;

        // Limpa espaços e valores vazios, elimina duplicados e ordena com acentos em PT
        const unicos = [...new Set(jogadoresGlobais)]
            .map(j => (j || "").toString().trim())
            .filter(j => j !== "");

        unicos.sort((a, b) => a.localeCompare(b, 'pt'));

        select.innerHTML = '<option value="">-- Selecione o Jogador --</option>';
        unicos.forEach(j => {
            select.innerHTML += `<option value="${j}">${j}</option>`;
        });

        if (valorAtual && unicos.includes(valorAtual)) {
            select.value = valorAtual;
        }
    }

    async function carregarDados() {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("COLE_AQUI")) return false;
        if (dadosCache) return true;

        try {
            const resp = await fetch(APPS_SCRIPT_URL);
            if (!resp.ok) throw new Error("Falha na rede");
            const data = await resp.json();
            
            // Suporta formatos com objeto ou array simples
            const registos = data.registos ? data.registos : (Array.isArray(data) ? data : []);
            dadosCache = registos;

            // 1. Adiciona jogadores da aba "Jogadores" no Google Sheets
            if (data.jogadores && Array.isArray(data.jogadores)) {
                jogadoresGlobais = jogadoresGlobais.concat(data.jogadores);
            }

            // 2. Adiciona jogadores com registos efetuados (por prevenção)
            for (let i = 1; i < registos.length; i++) {
                if (registos[i][1]) jogadoresGlobais.push(registos[i][1]);
            }

            renderizarDropdownJogadores();
            return true;
        } catch (e) {
            console.error("Erro ao carregar dados:", e);
            renderizarDropdownJogadores(true);
            return false;
        }
    }

    // Inicializa o carregamento dos dados assim que a página abre
    carregarDados();

    function alterarModoBusca() {
        const modo = document.getElementById('busca-tipo').value;
        const groupJog = document.getElementById('group-filtro-jogador');
        const groupMes = document.getElementById('group-filtro-mes');
        
        document.getElementById('filtro-jogador').value = "";
        document.getElementById('filtro-mes').value = "";

        if (modo === 'jogador') {
            groupJog.classList.remove('hidden');
            groupMes.classList.add('hidden');
        } else {
            groupJog.classList.add('hidden');
            groupMes.classList.remove('hidden');
        }
        
        consultar();
    }

    async function consultar() {
        const modo = document.getElementById('busca-tipo').value;
        const anoSel = document.getElementById('filtro-ano').value.toString().trim();
        const titulo = document.getElementById('resultado-titulo');
        const conteudo = document.getElementById('resultado-conteudo');
        
        conteudo.innerHTML = '';

        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("COLE_AQUI")) {
            titulo.innerText = 'Aviso';
            conteudo.innerHTML = '<span class="empty-msg">Substitua o APPS_SCRIPT_URL no código.</span>';
            return;
        }

        if (!dadosCache) {
            conteudo.innerHTML = '<span class="loading">⏳ A carregar dados...</span>';
            const sucesso = await carregarDados();
            if (!sucesso) {
                titulo.innerText = 'Erro de Ligação';
                conteudo.innerHTML = '<span class="empty-msg" style="color:#d90429;">Não foi possível carregar os dados. Verifique a ligação.</span>';
                return;
            }
            conteudo.innerHTML = '';
        }

        const formatar = (str) => (str || "").toString().trim().toLowerCase();

        if (!dadosCache || dadosCache.length <= 1) {
            conteudo.innerHTML = '<span class="empty-msg">Não há registos na folha.</span>';
            return;
        }

        if (modo === 'jogador') {
            const jog = document.getElementById('filtro-jogador').value;
            if (!jog) {
                titulo.innerText = 'Selecione um jogador';
                conteudo.innerHTML = '<span class="empty-msg">Escolha o jogador na lista acima.</span>';
                return;
            }
            titulo.innerText = `Meses pagos por ${jog} em ${anoSel}:`;

            let resultados = [];

            for (let i = 1; i < dadosCache.length; i++) {
                const row = dadosCache[i];
                const nomeSheet = formatar(row[1]);
                const mesSheet = row[2];
                const obsSheet = row[3] || "";
                const anoSheet = row[4] ? row[4].toString().trim() : "";

                if (nomeSheet === formatar(jog) && (anoSheet === anoSel || anoSheet === "")) {
                    resultados.push({ mes: mesSheet, obs: obsSheet });
                }
            }

            if (resultados.length === 0) {
                conteudo.innerHTML = `<span class="empty-msg">Sem pagamentos registados para ${anoSel}.</span>`;
            } else {
                resultados.forEach(r => {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    let txt = `✅ ${r.mes}`;
                    if (r.obs) txt += ` <span class="badge-obs">(${r.obs})</span>`;
                    badge.innerHTML = txt;
                    conteudo.appendChild(badge);
                });
            }

        } else {
            const mes = document.getElementById('filtro-mes').value;
            if (!mes) {
                titulo.innerText = 'Selecione um mês';
                conteudo.innerHTML = '<span class="empty-msg">Escolha o mês na lista acima.</span>';
                return;
            }
            titulo.innerText = `Jogadores que pagaram em ${mes} de ${anoSel}:`;

            let jogadoresPagosSet = new Set();

            for (let i = 1; i < dadosCache.length; i++) {
                const row = dadosCache[i];
                const nomeSheet = row[1];
                const mesSheet = formatar(row[2]);
                const anoSheet = row[4] ? row[4].toString().trim() : "";

                if (mesSheet === formatar(mes) && (anoSheet === anoSel || anoSheet === "")) {
                    if (nomeSheet) jogadoresPagosSet.add(nomeSheet.toString().trim());
                }
            }

            let jogadoresPagos = Array.from(jogadoresPagosSet);
            jogadoresPagos.sort((a, b) => a.localeCompare(b, 'pt'));

            if (jogadoresPagos.length === 0) {
                conteudo.innerHTML = `<span class="empty-msg">Nenhum jogador pagou em ${mes} de ${anoSel}.</span>`;
            } else {
                jogadoresPagos.forEach(j => {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.innerText = `👤 ${j}`;
                    conteudo.appendChild(badge);
                });
            }
        }
    }
</script>

</body>
</html>
