<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Previne cache para atualizar logo no GitHub / Cloudflare -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Pagamentos foot4</title>
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #52b788;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #e9ecef;
            --danger: #d90429;
            --danger-bg: #ffe5e5;
            --success-bg: #e8f5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 4px;
        }

        .content {
            padding: 20px 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid #ced4da;
            outline: none;
            background-color: #fff;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.25);
        }

        .result-card {
            background: #f1f8f5;
            border-left: 4px solid var(--accent);
            padding: 16px;
            border-radius: 10px;
            margin-top: 16px;
            min-height: 100px;
        }

        .result-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Estilos dos Cartões estilo Lista Completa */
        .player-row {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-pill {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-pill.pago {
            background: var(--success-bg);
            color: var(--primary-light);
        }

        .status-pill.falta {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .player-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .player-obs {
            font-size: 0.8rem;
            color: #6c757d;
            font-style: italic;
        }

        /* Modo de Badges / Balões */
        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-obs {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .empty-msg {
            color: #6c757d;
            font-size: 0.9rem;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: var(--primary-light);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pagamentos foot4</h1>
        <p>Consulta em Tempo Real</p>
    </div>

    <div class="content">
        <div class="form-group">
            <label for="filtro-ano">Ano</label>
            <select id="filtro-ano" onchange="consultar()">
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
        </div>

        <div class="form-group">
            <label for="busca-tipo">Modo de Consulta</label>
            <select id="busca-tipo" onchange="alterarModoBusca()">
                <option value="jogador">Por Jogador (Ver Meses Pagos)</option>
                <option value="mes" selected>Por Mês (Ver Lista Completa)</option>
            </select>
        </div>

        <div class="form-group hidden" id="group-filtro-jogador">
            <label for="filtro-jogador">Escolher Jogador</label>
            <select id="filtro-jogador" onchange="consultar()">
                <option value="">⏳ A carregar jogadores...</option>
            </select>
        </div>

        <div class="form-group" id="group-filtro-mes">
            <label for="filtro-mes">Escolher Mês</label>
            <select id="filtro-mes" onchange="consultar()">
                <option value="">-- Selecione o Mês --</option>
                <option value="Janeiro">Janeiro</option>
                <option value="Fevereiro">Fevereiro</option>
                <option value="Março">Março</option>
                <option value="Abril">Abril</option>
                <option value="Maio">Maio</option>
                <option value="Junho">Junho</option>
                <option value="Julho" selected>Julho</option>
                <option value="Agosto">Agosto</option>
                <option value="Setembro">Setembro</option>
                <option value="Outubro">Outubro</option>
                <option value="Novembro">Novembro</option>
                <option value="Dezembro">Dezembro</option>
            </select>
        </div>

        <div class="result-card">
            <div class="result-title" id="resultado-titulo">Selecione uma opção acima</div>
            <div id="resultado-conteudo" class="list-container">
                <span class="empty-msg">A aguardar seleção...</span>
            </div>
        </div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyenz_4qBYAiy3UK_4jWk7cBPMmHzffl-AbufDAnBPUq5Vk5J7QzNXEuuUK1T14tVFy/exec";

    let dadosCache = null;
    let jogadoresGlobais = [];
    let valorSemanalGlobal = 5;

    function contarQuartasFeiras(ano, nomeMes) {
        const meses = [
            "janeiro", "fevereiro", "março", "abril", "maio", "junho", 
            "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
        ];
        
        const numAno = parseInt(ano, 10);
        const idxMes = meses.indexOf((nomeMes || "").toString().trim().toLowerCase());
        
        if (idxMes === -1 || isNaN(numAno)) return 0;

        let quantidadeQuartas = 0;
        let data = new Date(numAno, idxMes, 1);

        while (data.getMonth() === idxMes) {
            if (data.getDay() === 3) {
                quantidadeQuartas++;
            }
            data.setDate(data.getDate() + 1);
        }

        return quantidadeQuartas;
    }

    window.receberDadosAppsScript = function(data) {
        if (!data) {
            renderizarDropdownJogadores(true);
            return;
        }

        const registos = data.registos ? data.registos : (Array.isArray(data) ? data : []);
        dadosCache = registos;

        if (data.valorSemanal) {
            valorSemanalGlobal = parseFloat(data.valorSemanal);
        }

        if (data.jogadores && Array.isArray(data.jogadores)) {
            jogadoresGlobais = jogadoresGlobais.concat(data.jogadores);
        }

        for (let i = 1; i < registos.length; i++) {
            if (registos[i][1]) jogadoresGlobais.push(registos[i][1]);
        }

        renderizarDropdownJogadores();

        const jog = document.getElementById('filtro-jogador').value;
        const mes = document.getElementById('filtro-mes').value;
        if (jog || mes) {
            consultar();
        } else {
            document.getElementById('resultado-titulo').innerText = "Selecione uma opção acima";
            document.getElementById('resultado-conteudo').innerHTML = '<span class="empty-msg">A aguardar seleção...</span>';
        }
    };

    function renderizarDropdownJogadores(erro = false) {
        const select = document.getElementById('filtro-jogador');
        if (!select) return;

        if (erro) {
            select.innerHTML = '<option value="">❌ Erro ao carregar jogadores</option>';
            document.getElementById('resultado-titulo').innerText = 'Erro de Ligação';
            document.getElementById('resultado-conteudo').innerHTML = '<span class="empty-msg" style="color:#d90429;">Não foi possível carregar os dados.</span>';
            return;
        }

        const valorAtual = select.value;

        const unicos = [...new Set(jogadoresGlobais)]
            .map(j => (j || "").toString().trim())
            .filter(j => j !== "");

        unicos.sort((a, b) => a.localeCompare(b, 'pt'));

        select.innerHTML = '<option value="">-- Selecione o Jogador --</option>';
        unicos.forEach(j => {
            select.innerHTML += `<option value="${j}">${j}</option>`;
        });

        if (valorAtual && unicos.includes(valorAtual)) {
            select.value = valorAtual;
        }
    }

    function carregarDados() {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("COLE_AQUI")) return;

        const script = document.createElement('script');
        script.src = `${APPS_SCRIPT_URL}?prefix=receberDadosAppsScript`;
        script.onerror = function() {
            renderizarDropdownJogadores(true);
        };
        document.body.appendChild(script);
    }

    carregarDados();

    function alterarModoBusca() {
        const modo = document.getElementById('busca-tipo').value;
        const groupJog = document.getElementById('group-filtro-jogador');
        const groupMes = document.getElementById('group-filtro-mes');
        const conteudo = document.getElementById('resultado-conteudo');
        
        document.getElementById('filtro-jogador').value = "";
        document.getElementById('filtro-mes').value = "";

        if (modo === 'jogador') {
            groupJog.classList.remove('hidden');
            groupMes.classList.add('hidden');
            conteudo.className = 'badge-list';
        } else {
            groupJog.classList.add('hidden');
            groupMes.classList.remove('hidden');
            conteudo.className = 'list-container';
        }
        
        consultar();
    }

    function consultar() {
        const modo = document.getElementById('busca-tipo').value;
        const anoSel = document.getElementById('filtro-ano').value.toString().trim();
        const titulo = document.getElementById('resultado-titulo');
        const conteudo = document.getElementById('resultado-conteudo');
        
        conteudo.innerHTML = '';

        if (!dadosCache) {
            conteudo.innerHTML = '<span class="loading">⏳ A carregar dados...</span>';
            return;
        }

        const formatar = (str) => (str || "").toString().trim().toLowerCase();

        if (!dadosCache || dadosCache.length <= 1) {
            conteudo.innerHTML = '<span class="empty-msg">Não há registos na folha.</span>';
            return;
        }

        if (modo === 'jogador') {
            const jog = document.getElementById('filtro-jogador').value;
            if (!jog) {
                titulo.innerText = 'Selecione um jogador';
                conteudo.innerHTML = '<span class="empty-msg">Escolha o jogador na lista acima.</span>';
                return;
            }
            titulo.innerText = `Meses pagos por ${jog} em ${anoSel}:`;

            let resultados = [];

            for (let i = 1; i < dadosCache.length; i++) {
                const row = dadosCache[i];
                const nomeSheet = formatar(row[1]);
                const mesSheet = row[2];
                const obsSheet = row[3] || "";
                const anoSheet = row[4] ? row[4].toString().trim() : "";

                if (nomeSheet === formatar(jog) && (anoSheet === anoSel || anoSheet === "")) {
                    resultados.push({ mes: mesSheet, obs: obsSheet });
                }
            }

            if (resultados.length === 0) {
                conteudo.innerHTML = `<span class="empty-msg">Sem pagamentos registados para ${anoSel}.</span>`;
            } else {
                resultados.forEach(r => {
                    const numQuartas = contarQuartasFeiras(anoSel, r.mes);
                    const totalCalculado = numQuartas * valorSemanalGlobal;

                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    let txt = `✅ ${r.mes} (${totalCalculado}€)`;
                    if (r.obs) txt += ` <span class="badge-obs">(${r.obs})</span>`;
                    badge.innerHTML = txt;
                    conteudo.appendChild(badge);
                });
            }

        } else {
            const mes = document.getElementById('filtro-mes').value;
            if (!mes) {
                titulo.innerText = 'Selecione um mês';
                conteudo.innerHTML = '<span class="empty-msg">Escolha o mês na lista acima.</span>';
                return;
            }

            const numQuartas = contarQuartasFeiras(anoSel, mes);
            const totalCalculado = numQuartas * valorSemanalGlobal;

            titulo.innerText = `Estado das cotas em ${mes} de ${anoSel} (${totalCalculado}€ · ${numQuartas} quartas):`;

            // Mapeia quem pagou e as respetivas observações
            let pagamentosMap = new Map();

            for (let i = 1; i < dadosCache.length; i++) {
                const row = dadosCache[i];
                const nomeSheet = row[1] ? row[1].toString().trim() : "";
                const mesSheet = formatar(row[2]);
                const obsSheet = row[3] ? row[3].toString().trim() : "";
                const anoSheet = row[4] ? row[4].toString().trim() : "";

                if (mesSheet === formatar(mes) && (anoSheet === anoSel || anoSheet === "")) {
                    if (nomeSheet) {
                        pagamentosMap.set(formatar(nomeSheet), obsSheet);
                    }
                }
            }

            // Lista única de todos os jogadores conhecidos
            const todosJogadores = [...new Set(jogadoresGlobais)]
                .map(j => (j || "").toString().trim())
                .filter(j => j !== "")
                .sort((a, b) => a.localeCompare(b, 'pt'));

            if (todosJogadores.length === 0) {
                conteudo.innerHTML = `<span class="empty-msg">Nenhum jogador registado.</span>`;
            } else {
                todosJogadores.forEach(j => {
                    const chave = formatar(j);
                    const pagou = pagamentosMap.has(chave);
                    const obs = pagou ? pagamentosMap.get(chave) : "";

                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'player-row';

                    let statusHTML = pagou 
                        ? `<div class="status-pill pago">✅ Pago</div>`
                        : `<div class="status-pill falta">❌ Em falta</div>`;

                    rowDiv.innerHTML = `
                        <div class="player-main">
                            ${statusHTML}
                            <span class="player-name">${j}</span>
                        </div>
                        ${obs ? `<span class="player-obs">${obs}</span>` : ''}
                    `;
                    conteudo.appendChild(rowDiv);
                });
            }
        }
    }
</script>

</body>
</html>
